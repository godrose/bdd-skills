schema_version: "1.0"
name: design-vague-ac
description: design flags a vague term in an acceptance criterion and shows scenarios in full, writing nothing before approval (a temp .bdd-draft-* file may exist while a lint row runs and is gone before the draft is shown)
tags: [design, ambiguity, spike]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >
    /bdd:design experiments-delete: Acceptance criterion: "A finished experiment can be deleted too."
    The statuses of this app are listed in STATUSES.txt. Show me the scenarios for approval.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: names-two-statuses
    target: last_message
    pattern: "finished[^\\n]{0,240}\\b(Completed|Failed|Cancelled)\\b[^\\n]{0,120}\\b(Completed|Failed|Cancelled)\\b"
    flags: i
    match: contains
  - type: llm
    name: treats-finished-as-open
    focus: last_message
    criteria: >
      The answer treats the word "finished" as an assumption or an open question, and asks the user
      to confirm the meaning.
  - type: regex
    name: has-given-when-then-lines
    target: last_message
    pattern: "Given [^\\n]*\\n\\s*When [^\\n]*\\n\\s*Then "
    match: contains
  - type: regex
    name: has-step-reuse-audit
    target: last_message
    pattern: reuse audit
    flags: i
    match: contains
  - type: regex
    name: audit-has-asserts-column
    target: last_message
    pattern: "\\| *Asserts *\\|"
    match: contains
  - type: regex
    name: tags-unautomated-in-specify-only
    target: last_message
    pattern: "@pending"
    match: contains
  - type: file_exists
    name: no-feature-file-before-approval
    path: features/experiments-delete*.feature
    exists: false
