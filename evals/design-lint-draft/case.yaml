schema_version: "1.0"
name: design-lint-draft
description: design lints the draft before showing it, acts only on findings in the draft, leaves old findings alone, and leaves no .bdd-draft-* file behind
tags: [design, lint, spike]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >
    /bdd:design reports-archive: Acceptance criterion: "A user can archive an open report."
    The ticket is TKT-42. Show me the scenarios for approval.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash]
runs: 3
graders:
  - type: tool_used
    name: runs-the-lint-row
    tool: Bash
    min: 1
  - type: regex
    name: draft-passes-lint
    target: last_message
    pattern: "(draft[^\\n]{0,80}(no|0|zero) findings|(no|0|zero) findings[^\\n]{0,40}draft)"
    flags: i
    match: contains
  - type: regex
    name: reports-old-findings-untouched
    target: last_message
    pattern: "(existing[^\\n]{0,120}(not touched|did not touch|didn't touch|untouched)|(\\d+|one) findings?[^\\n]{0,40}not touched)"
    flags: i
    match: contains
  - type: regex
    name: draft-carries-the-ticket-tag
    target: last_message
    pattern: "@TKT-42"
    match: contains
  - type: tool_used
    name: no-edit-of-existing-files
    tool: Edit
    min: 0
    max: 0
    arm: both
  - type: file_exists
    name: no-draft-file-left
    path: features/.bdd-draft-*
    exists: false
  - type: file_exists
    name: no-feature-file-before-approval
    path: features/reports-archive*.feature
    exists: false
  - type: regex
    name: scenarios-in-full
    target: last_message
    pattern: "Given [^\\n]+\\n(\\s*And [^\\n]+\\n)*\\s*When [^\\n]+\\n(\\s*And [^\\n]+\\n)*\\s*Then "
    flags: i
    match: contains
  - type: regex
    name: names-the-old-finding
    target: last_message
    pattern: "((finding|lint)[^\\n]{0,160}(reports\\.feature|An open report can be shared)|(reports\\.feature|An open report can be shared)[^\\n]{0,160}(finding|lint|tag))"
    flags: i
    match: contains
  - type: llm
    name: no-claim-of-tagging-old-scenario
    focus: last_message
    criteria: >
      The answer does not say that it added, changed or fixed a tag on the existing scenario
      "An open report can be shared". Saying that the scenario has no tag, or that it was left
      alone, satisfies this.
