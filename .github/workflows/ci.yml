name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash tests/run.sh
      - name: Release checks
        if: startsWith(github.event.pull_request.title, 'release:')
        run: bash tests/check_release.sh
