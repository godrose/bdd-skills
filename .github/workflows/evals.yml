name: evals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    if: github.event_name == 'workflow_dispatch' || vars.EVALS_NIGHTLY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.318
      - name: Install the Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
      # design-lint-draft needs plain Bash, which would hand the token to the agent. Run it by hand.
      - name: Run the evals
        id: evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          status=0
          for c in init-audit design-vague-ac triage-approval-gate run-zero-tests; do
            grants=(Write Edit)
            if [ "$c" = run-zero-tests ]; then
              grants+=("Bash(sh ./fake-test.sh:*)" "Bash(echo:*)" "Bash(ls:*)" "Bash(cat:*)")
            fi
            claude plugin eval plugin --trust-plugin --scaffold --runs 3 --ablation none \
              --model haiku --judge-model sonnet --no-publish \
              --max-cost-usd 1 --threshold 0.8 \
              --output-dir "results/$c" --case "$c" \
              --allow-tools "${grants[@]}" || status=1
          done
          exit $status
      - name: Summary
        if: always()
        env:
          EVAL_OUTCOME: ${{ steps.evals.outcome }}
        run: |
          shopt -s nullglob
          files=(results/*/aggregate-result.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No results were written. The run failed before any case finished." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVAL_OUTCOME" = "success" ]; then
            jq -rs '[.[].cases[] | select(.arms.with != null) | {n: .name, m: ([.arms.with[].score | select(. != null)] | add / length)}] as $c
              | "All \($c | length) cases passed the 0.8 threshold. Lowest: \($c | min_by(.m) | .n) at \($c | min_by(.m) | .m * 100 | round / 100). Cost: $\([.[].costUsd] | add * 100 | round / 100)."' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Case | Mean score | Runs |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.cases[] | select(.arms.with != null) | "| \(.name) | \(([.arms.with[].score | select(. != null)] | if length > 0 then (add / length * 100 | round / 100) else "n/a" end)) | \(.arms.with | length) |"' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Failed graders:" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.cases[] | .name as $n | .arms.with | to_entries[] | .key as $r | .value.graders[]? | select(.passed == false) | "- \($n) run \($r + 1): \(.name)"' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The agent answers are in the eval-results artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: results
          retention-days: 14
          if-no-files-found: ignore
