schema_version: "1.0"
name: init-audit
description: init --detect reports an existing value that does not resolve, and writes nothing
tags: [init, audit, spike]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bdd:init --detect
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: names-the-missing-path
    target: last_message
    pattern: src/step-defs
    match: contains
  - type: regex
    name: ends-with-not-checked-line
    target: last_message
    pattern: "Not checked: header text, test filters, whether commands work"
    match: contains
  - type: regex
    name: says-path-does-not-exist
    target: last_message
    pattern: "(src/step-defs[^\\n]{0,160}(does not exist|not exist|doesn.t exist|missing|not found|no such)|(does not exist|not exist|doesn.t exist|missing|not found|no such)[^\\n]{0,160}src/step-defs)"
    flags: i
    match: contains
  - type: llm
    name: no-claim-of-writing
    focus: last_message
    criteria: >
      The answer does not say that it wrote, changed or fixed any file. Saying that it changed
      nothing satisfies this.
  - type: llm
    name: asks-before-writing
    focus: last_message
    criteria: >
      The answer does not write anything on its own. Where it proposes a change, it asks the user
      which rows to write first. An answer that proposes no change satisfies this.
